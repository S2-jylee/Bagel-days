<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bagel Days</title>
  <script>
    // GitHub Pages has no server-side rewrite, so a hard refresh or direct
    // link to any route other than the root (e.g. /Bagel-days/menu) hits
    // this 404 page instead of index.html. This redirects back to
    // index.html, encoding the intended path in the query string so the
    // inline script in index.html can restore it via history.replaceState
    // before React Router mounts. pathSegmentsToKeep=1 preserves the repo
    // name segment (works regardless of what the repo is currently named).
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
      l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
      l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
      (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
