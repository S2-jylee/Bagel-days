<script>
  // Restores the real path that public/404.html redirected here with,
  // before React Router mounts and reads window.location.
  (function (l) {
    if (l.search[1] === "/") {
      var decoded = l.search
        .slice(1)
        .split("&")
        .map(function (s) { return s.replace(/~and~/g, "&"); })
        .join("?");
      window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
    }
  })(window.location);
</script>
